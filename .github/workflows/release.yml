name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyinstaller
      - name: Build
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name VolumeBooster
          --icon assets/volume-amplifier.ico
          --version-file version_info.txt
          --add-data "assets/volume-amplifier.ico;assets"
          app.py
      # The installer ships the folder build: an installed one-file app unpacks
      # itself into %TEMP% on every start, which is what broke the relaunch after
      # an automatic update.
      - name: Build folder payload
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name VolumeBooster
          --icon assets/volume-amplifier.ico
          --version-file version_info.txt
          --add-data "assets/volume-amplifier.ico;assets"
          app.py
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -LiteralPath dist/VolumeBooster.exe, README.md, LICENSE `
            -DestinationPath dist/VolumeBooster-portable.zip -Force
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          $version = (Select-String -Path version.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" "installer\volume-booster.iss"
          if (-not (Test-Path -LiteralPath "dist/VolumeBoosterSetup.exe")) { throw "installer was not produced" }
      - name: Checksums
        shell: pwsh
        run: |
          $lines = @(
            (Get-FileHash dist/VolumeBooster.exe -Algorithm SHA256).Hash + "  VolumeBooster.exe"
            (Get-FileHash dist/VolumeBooster-portable.zip -Algorithm SHA256).Hash + "  VolumeBooster-portable.zip"
            (Get-FileHash dist/VolumeBoosterSetup.exe -Algorithm SHA256).Hash + "  VolumeBoosterSetup.exe"
          )
          $lines | Set-Content dist/SHA256SUMS-windows.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/VolumeBooster.exe
            dist/VolumeBooster-portable.zip
            dist/VolumeBoosterSetup.exe
            dist/SHA256SUMS-windows.txt

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python, Tk and PyInstaller
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-tk
          python3 -m pip install --break-system-packages --disable-pip-version-check pyinstaller
      - name: Build
        run: |
          python3 -m PyInstaller --noconfirm --clean --onefile \
            --name VolumeBooster \
            --add-data "assets/volume-amplifier.ico:assets" \
            app.py
      - name: Checksums
        run: |
          cd dist
          sha256sum VolumeBooster > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/VolumeBooster
            dist/SHA256SUMS-linux.txt

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/VolumeBooster.exe
            artifacts/windows/VolumeBooster-portable.zip
            artifacts/windows/VolumeBoosterSetup.exe
            artifacts/windows/SHA256SUMS-windows.txt
            artifacts/linux/VolumeBooster
            artifacts/linux/SHA256SUMS-linux.txt
          generate_release_notes: true
