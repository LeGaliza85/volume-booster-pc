name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyinstaller
      - name: Build
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name VolumeBooster
          --icon assets/volume-amplifier.ico
          --version-file version_info.txt
          --add-data "assets/volume-amplifier.ico;assets"
          app.py
      # The installer ships the folder build: an installed one-file app unpacks
      # itself into %TEMP% on every start, which is what broke the relaunch after
      # an automatic update.
      - name: Build folder payload
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name VolumeBooster
          --icon assets/volume-amplifier.ico
          --version-file version_info.txt
          --add-data "assets/volume-amplifier.ico;assets"
          app.py
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -LiteralPath dist/VolumeBooster.exe, README.md, LICENSE `
            -DestinationPath dist/VolumeBooster-portable.zip -Force
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          $version = (Select-String -Path version.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" "installer\volume-booster.iss"
          if (-not (Test-Path -LiteralPath "dist/VolumeBoosterSetup.exe")) { throw "installer was not produced" }
      - name: Checksums
        shell: pwsh
        run: |
          $lines = @(
            (Get-FileHash dist/VolumeBooster.exe -Algorithm SHA256).Hash + "  VolumeBooster.exe"
            (Get-FileHash dist/VolumeBooster-portable.zip -Algorithm SHA256).Hash + "  VolumeBooster-portable.zip"
            (Get-FileHash dist/VolumeBoosterSetup.exe -Algorithm SHA256).Hash + "  VolumeBoosterSetup.exe"
          )
          $lines | Set-Content dist/SHA256SUMS-windows.txt -Encoding ascii
      # Optional: uploads the portable executable to VirusTotal when the repository
      # has a VIRUSTOTAL_API_KEY secret. The release body links the report by SHA-256.
      - name: VirusTotal
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VT_API_KEY)) {
            "VIRUSTOTAL_API_KEY is not set; skipping the upload."
            exit 0
          }
          $hash = (Get-FileHash -LiteralPath "dist/VolumeBooster.exe" -Algorithm SHA256).Hash.ToLower()
          $headers = @{ "x-apikey" = $env:VT_API_KEY }
          $form = @{ file = Get-Item -LiteralPath "dist/VolumeBooster.exe" }
          Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files" `
            -Method Post -Headers $headers -Form $form | Out-Null
          "https://www.virustotal.com/gui/file/$hash" |
            Set-Content -LiteralPath "dist/VIRUSTOTAL.txt" -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/VolumeBooster.exe
            dist/VolumeBooster-portable.zip
            dist/VolumeBoosterSetup.exe
            dist/SHA256SUMS-windows.txt
            dist/VIRUSTOTAL.txt

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python, Tk and PyInstaller
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-tk
          python3 -m pip install --break-system-packages --disable-pip-version-check pyinstaller
      - name: Build
        run: |
          python3 -m PyInstaller --noconfirm --clean --onefile \
            --name VolumeBooster \
            --add-data "assets/volume-amplifier.ico:assets" \
            app.py
      - name: Checksums
        run: |
          cd dist
          sha256sum VolumeBooster > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/VolumeBooster
            dist/SHA256SUMS-linux.txt

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Compose release body
        run: |
          {
            echo "## Verify the download"
            echo ""
            echo 'Every release publishes `SHA256SUMS-windows.txt`. Compare it with the file you downloaded:'
            echo ""
            echo '```powershell'
            echo 'Get-FileHash .\VolumeBooster.exe -Algorithm SHA256'
            echo '```'
            echo ""
            echo 'The output must match the `VolumeBooster.exe` line in `SHA256SUMS-windows.txt`. If it does not match, do not run the file.'
            echo ""
            echo '- **Source and tests:** the full source and all 15 test suites are public, and CI runs them on Windows and Linux with Python 3.11-3.13: https://github.com/LeGaliza85/volume-booster-pc/actions/workflows/ci.yml'
            echo '- **Build it yourself:** `build.ps1` produces the same executable from source.'
            if [ -f artifacts/windows/VIRUSTOTAL.txt ]; then
              echo "- **VirusTotal:** $(cat artifacts/windows/VIRUSTOTAL.txt | tr -d '\r\n')"
            fi
            echo ""
            echo 'The executable is not code-signed, so SmartScreen shows "Windows protected your PC". That is a reputation warning for new unsigned binaries, not a virus detection.'
          } > release-body.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: |
            artifacts/windows/VolumeBooster.exe
            artifacts/windows/VolumeBooster-portable.zip
            artifacts/windows/VolumeBoosterSetup.exe
            artifacts/windows/SHA256SUMS-windows.txt
            artifacts/linux/VolumeBooster
            artifacts/linux/SHA256SUMS-linux.txt
          generate_release_notes: true
