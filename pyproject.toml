[project]
name = "volume-booster-pc"
version = "1.5.5"
description = "Free, open-source system-wide volume booster for PC: raise Windows audio above 100 % (Equalizer APO) or boost Linux volume with PipeWire/PulseAudio."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "LeGaliza85", email = "LeGaliza85@users.noreply.github.com" }]
keywords = ["volume", "audio", "equalizer-apo", "pipewire", "pulseaudio", "windows", "linux"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["SIM117"]
"i18n.py" = ["E501"]
"apo.py" = ["SIM112"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
files = [
    "app.py",
    "apo.py",
    "autostart.py",
    "backend.py",
    "backend_linux.py",
    "backend_windows.py",
    "configfile.py",
    "confirmdialog.py",
    "diagnostics.py",
    "gainmath.py",
    "hotkey.py",
    "i18n.py",
    "preview.py",
    "report.py",
    "settingswindow.py",
    "tray.py",
    "update.py",
    "updater.py",
    "winenv.py",
    "settings.py",
    "theme.py",
    "verify.py",
    "version.py",
    "widgets.py",
]
